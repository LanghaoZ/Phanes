syntax = "proto3";

package phanes.task;

option csharp_namespace = "Phanes.Task.Sdk";

// TaskType identifies which handler should process an event.
// Add new task types here as the system grows; zero value is reserved.
enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
}

// TaskEvent is the unit of work dispatched to a task actor via Kafka.
// Partition and Offset are Kafka transport metadata and are NOT part of
// this schema — they are attached by the consumer after deserialization.
message TaskEvent {
  TaskType            task_type = 1;
  string              task_id   = 2;
  string              event_id  = 3;
  string              content   = 4;
  map<string, string> context   = 5;
}

// TaskResult is returned by ITaskHandler.ExecuteAsync after processing
// a single TaskEvent.
message TaskResult {
  string    task_id        = 1;
  string    event_id       = 2;
  bool      ok             = 3;
  string    error_message  = 4;
  string    status         = 5;
  // Optional: handler may return a follow-up event to be re-enqueued.
  TaskEvent followup_event = 6;
}
